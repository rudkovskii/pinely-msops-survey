<style>
  :root{
    --bg:#ffffff; --ink:#0b0b0b; --green:#34A948; --green2:#62C584; --soft:#eaf7ee;
    --muted:#5c665f; --yellow:#f2c230; --red:#e5484d; --grey:#b9c0bb;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:17px;line-height:1.5;
    -webkit-text-size-adjust:100%;
    background-image:radial-gradient(rgba(0,0,0,.07) 1px, transparent 1px);background-size:8px 8px}
  .wrap{max-width:720px;margin:0 auto;padding:12px 16px 120px}
  button,input,textarea{font-family:var(--mono)}
  :focus-visible{outline:3px dashed var(--green);outline-offset:3px}

  /* прогресс */
  .top{padding:0 0 8px;border-bottom:3px solid var(--ink);margin-bottom:16px}
  .pbar{display:flex;gap:3px}
  .pbar i{flex:1;height:12px;border:2px solid var(--ink);background:#fff}
  .pbar i.done{background:var(--green)}
  .pbar i.cur{background:var(--green2);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{background:#fff}}
  .pmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:6px}
  .pmeta b{background:var(--ink);color:#fff;padding:0 6px}

  /* окно-монитор */
  .monitor{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:#06110a;margin:0 0 22px}
  .tbar{display:flex;justify-content:space-between;gap:8px;background:var(--green);border-bottom:3px solid var(--ink);
    font-size:12px;font-weight:700;padding:2px 8px;white-space:nowrap;overflow:hidden}
  .tbar span:last-child{letter-spacing:4px}
  canvas{display:block;width:100%;aspect-ratio:2/1;image-rendering:pixelated;image-rendering:crisp-edges}

  h1,h2{font-size:23px;line-height:1.3;margin:0 0 10px}
  h1{font-size:27px}
  .blk{display:inline-block;font-size:13px;font-weight:700;background:var(--ink);color:#fff;padding:2px 8px;margin-bottom:10px}
  .hint{color:var(--muted);font-size:15px;margin:0 0 14px}
  p{margin:0 0 14px}
  .note{border:3px solid var(--ink);background:var(--soft);padding:12px 14px;font-size:15px;margin:16px 0}

  .btn{font-size:17px;font-weight:700;border:3px solid var(--ink);background:var(--green);color:#000;
    padding:12px 22px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;min-height:48px}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn.ghost{background:#fff}
  .btn[disabled]{opacity:.5;cursor:default}

  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font-size:16px;color:var(--ink);
    border:3px solid var(--ink);background:#fff;padding:11px 14px;margin:0 0 10px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-height:48px}
  .opt::before{content:"[ ]";flex:0 0 auto;font-weight:700}
  .opt.radio::before{content:"( )"}
  .opt[aria-pressed="true"]{background:var(--green)}
  .opt[aria-pressed="true"]::before{content:"[x]"}
  .opt.radio[aria-pressed="true"]::before{content:"(*)"}
  .opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .chip{font-size:14px;border:2px solid var(--ink);background:#fff;padding:7px 11px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink);text-align:left}
  .chip[aria-pressed="true"]{background:var(--green)}

  input[type=text],textarea{width:100%;font-size:16px;border:3px solid var(--ink);padding:11px 13px;background:#fff;color:var(--ink);border-radius:0}
  textarea{min-height:92px;resize:vertical}
  .cnt{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
  .field{margin:6px 0 16px}
  .flabel{display:block;font-weight:700;font-size:15px;margin:0 0 6px}

  /* светофор */
  .tl{border:3px solid var(--ink);background:#fff;padding:10px 12px;margin:0 0 12px;box-shadow:3px 3px 0 var(--ink)}
  .tl-t{font-weight:700;font-size:15px;margin-bottom:8px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg button{font-size:12px;border:2px solid var(--ink);background:#fff;padding:6px 4px;cursor:pointer;min-height:44px;color:var(--ink);line-height:1.25}
  .seg button .dot{display:block;width:12px;height:12px;margin:0 auto 3px;border:2px solid var(--ink)}
  .seg button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:-1px;font-weight:700}
  .c-green .dot,.c-green[aria-pressed="true"]{background:var(--green)}
  .c-yellow .dot,.c-yellow[aria-pressed="true"]{background:var(--yellow)}
  .c-red .dot,.c-red[aria-pressed="true"]{background:var(--red)}
  .c-unknown .dot,.c-unknown[aria-pressed="true"]{background:var(--grey)}
  .c-green[aria-pressed="true"] .dot,.c-yellow[aria-pressed="true"] .dot,.c-red[aria-pressed="true"] .dot,.c-unknown[aria-pressed="true"] .dot{background:#fff}
  .seg3{grid-template-columns:repeat(3,1fr)}
  .seg3 button[aria-pressed="true"]{background:var(--green)}

  /* схема «что видит Claude» */
  .ctx svg{width:100%;height:auto;display:block;margin:0 0 12px;border:3px solid var(--ink);background:#fff}
  .ctx .node{cursor:pointer}
  .ctx .node rect{fill:#fff;stroke:#0b0b0b;stroke-width:3}
  .ctx .node.on rect{fill:#34A948}
  .ctx .node:focus{outline:none}
  .ctx .node:focus-visible rect{stroke:#34A948;stroke-dasharray:4 3}
  .ctx .num{font:700 15px var(--mono);fill:#0b0b0b}

  /* сетка функций */
  .feat{border:3px solid var(--ink);background:#fff;padding:10px 12px;margin:0 0 10px}
  .feat-t{font-weight:700;font-size:15px;margin-bottom:8px}

  /* порядок блоков */
  .rank{list-style:none;padding:0;margin:0 0 16px}
  .rank li{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);background:var(--green);padding:8px 10px;margin:0 0 8px;font-size:15px}
  .rank .n{font-weight:700;background:var(--ink);color:#fff;padding:0 7px}
  .rank .t{flex:1}
  .rank button{border:2px solid var(--ink);background:#fff;min-width:40px;min-height:36px;cursor:pointer;font-size:14px;color:var(--ink)}

  /* имя */
  .names{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}

  /* низ */
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--ink);z-index:6}
  .nav .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;gap:12px}
  .status{font-weight:700;margin:10px 0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:600px){
    body{font-size:16px}
    h1{font-size:23px} h2{font-size:20px}
    .bins{grid-template-columns:1fr}
    .seg button{font-size:11px;padding:6px 2px}
  }
  @media (prefers-reduced-motion:reduce){ .pbar i.cur{animation:none} }

  /* ===== режим разработчика ===== */
  .devbar{position:sticky;top:0;z-index:20;background:#fff3c4;border-bottom:3px solid var(--ink);font-size:13px}
  .devbar .in{max-width:980px;margin:0 auto;padding:6px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .devbar b{background:var(--ink);color:#fff3c4;padding:1px 6px}
  .devbar button,.devbar select{font:inherit;font-size:13px;border:2px solid var(--ink);background:#fff;padding:4px 8px;cursor:pointer;color:var(--ink)}
  .devbar button.on{background:#f2c230}
  body.dev-edit [data-k]{outline:2px dashed #c99a0e;outline-offset:1px;cursor:text}
  body.dev [data-k].edited{background:#fff3c4 !important;box-shadow:inset 0 -3px 0 #c99a0e}
  body.dev [data-k].noted{box-shadow:inset 0 -3px 0 #e5484d}
  .devmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
  .devmodal .box{background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:640px;width:100%;padding:16px;font-size:14px}
  .devmodal h3{margin:0 0 8px;font-size:17px}
  .devmodal code{background:#eee;padding:0 4px;word-break:break-all}
  .devmodal textarea{min-height:80px;font-size:14px;margin-bottom:10px}
  .devmodal .orig{background:#f4f4f4;border:2px solid #ddd;padding:8px;margin:0 0 10px;white-space:pre-wrap}
  .devmodal .acts{display:flex;gap:8px;flex-wrap:wrap}
  .devmodal .acts button{font:inherit;font-size:14px;border:2px solid var(--ink);background:#fff;padding:8px 12px;cursor:pointer}
  .devmodal .acts button.pri{background:var(--green);font-weight:700}
  .devlist{max-height:50vh;overflow:auto;border:2px solid #ddd;margin:0 0 10px}
  .devlist div{border-bottom:1px solid #eee;padding:6px 8px}
</style>
</head>

function store(kind){ try{ return kind==='l' ? window.localStorage : window.sessionStorage }catch(e){ return null } }
function readJSON(kind,key,def){ try{ const v=store(kind)?.getItem(key); return v?JSON.parse(v):def }catch(e){ return def } }
function writeJSON(kind,key,val){ try{ store(kind)?.setItem(key, JSON.stringify(val)) }catch(e){} }

// тексты по ключу вида 'STRINGS.q1_title' или 'OPTIONS.q1.never'
function getOrig(key){
  const parts = key.split('.');
  let v = CFG[parts[0]];
  for(let i=1;i<parts.length;i++){
    if(v==null) return '';
    if(Array.isArray(v)){ const f=v.find(x=>x && x.id===parts[i]); v = f!==undefined ? f : v[+parts[i]]; }
    else v = v[parts[i]];
  }
  if(v && typeof v==='object') v = v.label;
  return v==null ? '' : String(v);
}
function T(key, vars){
  const ed = DEV && DEVSTATE.edits[key];
  let s = (ed && ed.text!=null) ? ed.text : getOrig(key);
  if(vars) s = s.replace(/\{(\w+)\}/g, (m,k)=> vars[k]!=null ? vars[k] : m);
  return s;
}

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k==='k') e.dataset.k = v;
    else if(k==='fid') e.dataset.fid = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='value') e.value = v;
    else e.setAttribute(k, v===true ? '' : v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null || c===false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function tx(tag, key, attrs, vars){ return h(tag, {...(attrs||{}), k:key}, T(key, vars)); }

const BLOCK_OF = {q1:1,q2:1,q3:2,q4:3,q5:3,q6:4,q7:4,q8:5};
const isQ = id => /^q\d+$/.test(id);

function newSid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
let S = readJSON('s', SS_STATE, null);
if(!S || !S.sid){ S = {sid:newSid(), cur:'start', A:{}, visited:['start'], started:new Date().toISOString()}; }

function save(){ writeJSON('s', SS_STATE, S); }
function visible(id){ return true; }
function vlist(){ return SCREENS.filter(visible); }
function qlist(){ return vlist().filter(isQ); }

/* ---------------- отправка ---------------- */
function payload(status){
  const A = S.A;
  const fake = FEATURES.filter(f=>f.fake).map(f=>f.id);
  const q3 = A.q3 || {};
  return {
    v:2, survey:CONFIG.SURVEY_ID, sid:S.sid, status, dev:DEV,
    ts:new Date().toISOString(), started:S.started, last_screen:S.cur,
    name:(A.name||'').trim(),
    q1:A.q1||'',
    q2:A.q2||[], q2_other:(A.q2||[]).includes('other') ? (A.q2_other||'') : '',
    q3,
    overclaim: fake.some(id=>q3[id]==='use'),
    q4:A.q4_unknown ? ['unknown'] : (A.q4||[]),
    q5:A.q5||{},
    q6:A.q6||'', q6_want:A.q6_want||[],
    q7:A.q7||[], q7_other:(A.q7||[]).includes('other') ? (A.q7_other||'') : '',
    q8:A.q8||[], q8_awkward:A.q8_awkward||'',
  };
}
function post(obj){
  if(!CONFIG.ENDPOINT) return Promise.resolve('no-endpoint');
  return fetch(CONFIG.ENDPOINT, {method:'POST', mode:'no-cors', keepalive:true,
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(obj)});
}
let sendTimer = null;
function sendPartial(){
  clearTimeout(sendTimer);
  sendTimer = setTimeout(()=>{ post(payload('partial')).catch(()=>{}); }, 600);
}
let finalState = 'idle';
function sendFinal(){
  clearTimeout(sendTimer);
  finalState = 'sending'; renderBody();
  post(payload('done')).then(()=>{ finalState='sent'; renderBody(); })
    .catch(()=>{ finalState='error'; renderBody(); });
}

/* ---------------- навигация ---------------- */
function go(delta){
  const L = vlist(); let i = L.indexOf(S.cur); if(i<0) i=0;
  i = Math.max(0, Math.min(L.length-1, i+delta));
  S.cur = L[i];
  if(!S.visited.includes(S.cur)) S.visited.push(S.cur);
  save(); render(); window.scrollTo(0,0);
  if(S.cur==='final'){ if(finalState==='idle') sendFinal(); }
  else if(delta>0 && S.cur!=='name') sendPartial();
}
function changed(){ save(); renderBody(); }

function answered(id){
  const A=S.A, v=A[id];
  if(id==='q4') return !!(A.q4_unknown || (A.q4||[]).length);
  if(id==='q6') return !!(A.q6 || (A.q6_want||[]).length);
  if(id==='q8') return !!((A.q8||[]).length || A.q8_awkward);
  if(v==null || v==='') return false;
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==='object') return Object.values(v).some(Boolean);
  return true;
}

const $top = document.getElementById('top'), $app = document.getElementById('app'), $nav = document.getElementById('nav');

function render(){
  renderTop(); renderBody(); renderNav(); setScene(S.cur);
  document.getElementById('tbarname').textContent = 'C:\\MSOPS\\' + S.cur.toUpperCase() + '.EXE';
  if(DEV) renderDev();
}
function renderTop(){
  $top.innerHTML = '';
  const Q = qlist(), idx = Q.indexOf(S.cur);
  const bar = h('div',{class:'pbar','aria-hidden':'true'}, Q.map((q,i)=> h('i',{class: S.cur==='final' || (idx>=0 && i<idx) ? 'done' : (i===idx ? 'cur' : '')})));
  let left, right;
  if(idx>=0){
    left = tx('span', 'STRINGS.block'+BLOCK_OF[S.cur]);
    const l = Q.length-idx-1;
    right = h('span',{}, h('b',{k:'STRINGS.progress'}, T('STRINGS.progress',{n:idx+1,total:Q.length})), ' ',
      l>0 ? tx('span','STRINGS.left',{}, {left:l}) : tx('span','STRINGS.left_zero'));
  } else if(S.cur==='final'){
    left = h('span',{}, ''); right = h('b',{}, Q.length + ' / ' + Q.length);
  } else {
    left = h('span',{}, ''); right = tx('b','STRINGS.upfront',{}, {total:Q.length});
  }
  $top.append(bar, h('div',{class:'pmeta'}, left, right));
}
function renderNav(){
  $nav.innerHTML = '';
  if(S.cur==='start' || S.cur==='final'){ $nav.style.display='none'; document.body.style.paddingBottom='0'; return; }
  $nav.style.display='';
  const nextKey = (S.cur==='name' ? (S.A.name ? 'STRINGS.next' : 'STRINGS.skip') : (answered(S.cur) ? 'STRINGS.next' : 'STRINGS.skip'));
  $nav.append(h('div',{class:'in'},
    h('button',{class:'btn ghost',type:'button',onclick:()=>go(-1)}, '← ', tx('span','STRINGS.back')),
    h('button',{class:'btn',type:'button',id:'nextbtn',onclick:()=>go(1)}, tx('span',nextKey), ' →')));
}
function renderBody(){
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  $app.innerHTML = '';

  $app.append(fn ? fn() : h('div'));
  if(fid){ const el = $app.querySelector(`[data-fid="${CSS.escape(fid)}"]`); if(el) el.focus({preventScroll:true}); }
  renderNav();

}

function neo(x,y,o){ o=o||{}; const s=o.s||1; const legs = o.walk==null ? LEGS[0] : LEGS[1+(Math.floor(o.walk)%2)];
  SP([...NEO, ...legs], x, y, {s, flip:o.flip, ol:o.ol===undefined?GLOW:o.ol});
  if(o.glint){ R_(x+3*s, y+3*s, s, s, '#c8ffd4'); }
}
function robot(x,y,o){ SP(ROBOT,x,y,Object.assign({ol:'#5a3020'},o||{})); }
function mark(spr,x,y,c,a){ X.globalAlpha=a==null?1:a; SP(spr,x,y,{pal:{w:c||'#9dffb4'}}); X.globalAlpha=1; }
function floor_(y,c){ R_(0,y,W,H-y,c||'#16301f'); }
function doc(x,y,stamp){ R_(x,y,7,9,'#f4f4ef'); R_(x+1,y+2,5,1,'#9aa39d'); R_(x+1,y+4,5,1,'#9aa39d'); R_(x+1,y+6,3,1,'#9aa39d'); if(stamp) R_(x+4,y+5,2,3,'#34A948'); }
function rain(x0,y0,w,h,t,dens,seed,alpha){
  for(let i=0;i<w;i+=3){
    if(hash(i*1.3+seed)>dens) continue;
    const sp=12+hash(i*7.1+seed)*28, len=5+Math.floor(hash(i*3.7+seed)*14), off=hash(i*13.3+seed)*300;
    const head=Math.floor((t*sp+off)%(h+len));
    for(let k=0;k<len;k++){
      const yy=head-k; if(yy<0||yy>=h) continue;
      X.globalAlpha=alpha*(1-k/len);
      X.fillStyle = k===0 ? '#e2ffe8' : (k<3 ? '#62C584' : '#2f9a45');
      X.fillRect(x0+i,y0+yy,1,1);
      if(hash(i+yy*7+Math.floor(t*6))>.6) X.fillRect(x0+i+1,y0+yy,1,1);
    }
  }
  X.globalAlpha=1;
}
function ellipse(cx,cy,rx,ry,c){ for(let a=0;a<Math.PI*2;a+=0.05) R_(cx+Math.cos(a)*rx, cy+Math.sin(a)*ry, 1,1,c); }

const SCENES = {
  start(t){
    R_(0,0,W,H,'#06110a'); rain(0,0,W,H,t,.9,1,.6);
    R_(0,72,W,8,'#0b1f12');
    neo(70,36,{s:2,glint:(t%3)<0.25});
  },
  name(t){
    R_(0,0,W,H,'#06110a'); rain(0,0,W,H,t,.5,9,.2); R_(0,72,W,8,'#0b1f12');
    neo(34,36,{s:2,glint:(t%2.5)<0.25});
    for(let k=0;k<3;k++){ const ph=(t*0.7+k/3)%1; mark(QMARK, 28+k*12, 30-ph*24, '#9dffb4', 1-ph); }
    // бейдж
    R_(84,18,62,44,'#e8ece9'); R_(110,14,10,6,'#9aa39d'); R_(84,52,62,10,'#34A948');
    R_(89,24,16,20,'#1e2120'); mark(QMARK,94,30,'#62C584');
    const w = 4+Math.floor((t*12)%30); R_(110,26,w,3,'#1e2120'); if(Math.floor(t*3)%2) R_(111+w,25,1,5,'#1e2120');
    R_(110,34,28,1,'#9aa39d'); R_(110,38,20,1,'#9aa39d'); R_(110,42,24,1,'#9aa39d');
  },
  q1(t){
    R_(0,0,W,H,'#050d08'); rain(0,0,W,H,t,.6,7,.18);
    R_(52,52,3,12,'#2b2f2d'); R_(52,62,18,2,'#2b2f2d'); R_(60,64,2,9,'#2b2f2d'); R_(55,73,12,1,'#2b2f2d');
    SP(NEO_SIT,56,46,{ol:GLOW}); if((t%2)<1) R_(63,49,1,1,'#62C584');
    const b=Math.floor(t*10)%2; R_(67,55+b,2,1,PAL.s); R_(70,56-b,2,1,PAL.s);
    R_(60,60,96,3,'#3a2b1d'); R_(66,63,3,17,'#2a1f15'); R_(148,63,3,17,'#2a1f15');
    R_(98,24,48,34,'#3d4440'); R_(100,26,44,29,'#000'); rain(100,26,44,29,t*1.3,.95,3,1);
    R_(118,58,8,2,'#3d4440'); R_(72,57,20,3,'#555c58');
  },
  q2(t){
    R_(0,0,W,H,'#0b1610'); floor_(68);
    for(let r=0;r<10;r++) for(let c=0;c<4;c++){ const off=r%2?4:0; R_(104+c*8+off-4,20+r*5,7,4,'#7a4a2a'); }
    R_(100,20,4,48,'#0b1610'); R_(136,20,8,48,'#0b1610');
    const p=t%6; let x, walk=null;
    if(p<2.5){ x=20+p*29.6; walk=t*8; } else if(p<3){ x=94-Math.abs(Math.sin((p-2.5)*30))*2; } else if(p<4.2){ x=94-(p-3)*12; walk=t*8; } else x=79.6;
    neo(x,50,{walk});
    if(p>=3) mark(QMARK,x+2,40,'#9dffb4');
    if(p>=4.2 && Math.floor(t*4)%2){ R_(112,48,12,20,'#34A948'); R_(114,50,8,18,'#000'); }
  },
  q3(t){
    R_(0,0,W,H,'#0b1610'); R_(4,18,152,44,'#1e2120'); R_(4,18,152,3,'#34A948');
    const cur=Math.floor(t/0.8)%6;
    for(let i=0;i<6;i++){
      const x=10+i*24, y=28; R_(x,y,20,20,'#3d4440'); R_(x+1,y+1,18,18,'#121614');
      const dy = i===cur ? -Math.round(Math.abs(Math.sin(t*6))*2) : 0, yy=y+dy;
      if(i===0){ R_(x+4,yy+7,12,8,'#f2c230'); R_(x+4,yy+5,5,2,'#f2c230'); }
      if(i===1){ R_(x+5,yy+3,10,14,'#f4f4ef'); R_(x+7,yy+6,6,1,'#34A948'); R_(x+7,yy+9,6,1,'#34A948'); R_(x+7,yy+12,4,1,'#34A948'); }
      if(i===2){ R_(x+11,yy+3,3,4,'#62C584'); R_(x+9,yy+7,5,2,'#62C584'); R_(x+8,yy+9,3,3,'#62C584'); R_(x+7,yy+12,3,4,'#62C584'); }
      if(i===3){ R_(x+6,yy+8,8,6,'#9aa39d'); R_(x+7,yy+5,1,3,'#9aa39d'); R_(x+12,yy+5,1,3,'#9aa39d'); R_(x+9,yy+14,2,3,'#9aa39d'); }
      if(i===4){ R_(x+9,yy+6,2,9,'#f4f4ef'); R_(x+7,yy+8,6,1,'#f4f4ef'); R_(x+8,yy+7,4,1,'#f4f4ef'); R_(x+5,yy+15,10,1,'#f4f4ef'); }
      if(i===5){ R_(x+6,yy+6,8,8,'#8a7cff'); R_(x+7,yy+7,2,2,'#cfc8ff'); }
    }
    const x=10+cur*24, y=28;
    [[x-2,y-2],[x+17,y-2],[x-2,y+17],[x+17,y+17]].forEach(([a,b])=>{ R_(a,b,5,1,'#9dffb4'); R_(a+(a>x?4:0),b,1,5,'#9dffb4'); });
  },
  q4(t){
    R_(0,0,W,H,'#06110a');
    const cx=80, cy=40; ellipse(cx,cy,60,30,'#123a1f'); ellipse(cx,cy,32,16,'#123a1f');
    const ang=(t*1.4)%(Math.PI*2);
    for(let d=0;d<10;d++){ const a=ang-d*0.06; X.globalAlpha=1-d/10; for(let r=4;r<62;r+=1) R_(cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.5,1,1,'#34A948'); }
    X.globalAlpha=1;
    R_(cx-7,cy-5,14,8,'#3d4440'); R_(cx-6,cy-4,12,6,'#62C584'); R_(cx-9,cy+3,18,2,'#3d4440');
    const cols=['#62C584','#f4f4ef','#f4f4ef','#8a7cff','#8a7cff','#f2c230','#d97757','#9aa39d'];
    for(let i=0;i<8;i++){
      const a=-Math.PI/2+i*Math.PI/4, x=cx+Math.cos(a)*58-4, y=cy+Math.sin(a)*28-3;
      let diff=((ang-((a+Math.PI*2)%(Math.PI*2)))+Math.PI*4)%(Math.PI*2); const g=diff<1?1-diff:0;
      if(g>.4) R_(x-1,y-1,10,9,'#9dffb4');
      X.globalAlpha=.35+.65*g; R_(x,y,8,7,cols[i]); R_(x+2,y+2,4,1,'#06110a'); R_(x+2,y+4,3,1,'#06110a'); X.globalAlpha=1;
    }
  },
  q5(t){
    R_(0,0,W,H,'#0b1610'); floor_(66);
    R_(22,30,3,36,'#3d4440'); R_(16,6,15,26,'#1e2120');
    const ph=Math.floor(t/1.3)%3; // 0 зелёный, 1 жёлтый, 2 красный
    R_(20,9,7,6, ph===2?'#e5484d':'#3a1416'); R_(20,17,7,6, ph===1?'#f2c230':'#3a3210'); R_(20,25,7,4, ph===0?'#34A948':'#0f2a16');
    R_(36,60,124,4,'#3d4440');
    const cyc=Math.floor(t/3.9), r=t-cyc*3.9; let pos=cyc*36.4;
    pos += Math.min(r,1.3)*20 + Math.max(0,Math.min(r-1.3,1.3))*8;
    for(let i=0;i<6;i++){ const x=36+((pos+i*24)%130); if(x<154) doc(x,51,false); }
    for(let i=0;i<16;i++) R_(38+i*8,62,2,1,'#6b7570');
  },
  q6(t){
    R_(0,0,W,H,'#0b1610'); floor_(66);
    R_(0,58,W,4,'#3d4440');
    const sh=t*16;
    for(let i=0;i<6;i++){ const x=((sh+i*32)%192)-16; doc(x,49,x>78); }
    const phase=sh%32, down=Math.abs(phase-29)<3 || phase<1;
    R_(80,0,3,down?40:30,'#9aa39d'); R_(77,down?40:30,9,5,'#d97757');
    const gear=(cx,cy,r,a,c)=>{ for(let k=0;k<8;k++){ const aa=a+k*Math.PI/4; R_(cx+Math.cos(aa)*r-1, cy+Math.sin(aa)*r-1,3,3,c); } for(let yy=-r+2;yy<=r-2;yy++) for(let xx=-r+2;xx<=r-2;xx++) if(xx*xx+yy*yy<(r-2)*(r-2)) R_(cx+xx,cy+yy,1,1,c); R_(cx-1,cy-1,2,2,'#0b1610'); };
    gear(24,22,7,t*2,'#62C584'); gear(37,32,5,-t*2.8+0.3,'#34A948');
    robot(134,46,{});
  },
  q7(t){
    R_(0,0,W,H,'#0a1a10');
    R_(0,12,W,3,'#3d4440'); for(let i=0;i<24;i++) R_(((i*8 - t*20)%W+W)%W,13,3,1,'#6b7570');
    const BX=[22,66,110], cols=['#34A948','#f2c230','#7d877f'];
    const P=0.9, K=Math.floor(t/P);
    for(let k=K-3;k<=K;k++){
      const age=t-k*P; if(age<0) continue;
      const b=Math.floor(hash(k*9.1)*3), tx_=BX[b]+10; let x,y;
      if(age<1.4){ x=-8+(tx_+8)*(age/1.4); y=6; } else if(age<2.2){ const f=(age-1.4)/0.8; x=tx_; y=6+f*f*52; } else continue;
      R_(x,y,8,6,'#f4f4ef'); R_(x+1,y+2,6,1,'#9aa39d');
    }
    BX.forEach((x,i)=>{ R_(x-2,56,32,3,'#0b0b0b'); R_(x,58,28,22,cols[i]); });
    SP(CHECK,32,64,{pal:{w:'#000'}}); SP(["..w..",".www.","wwwww",".w.w."],43+36,64,{pal:{w:'#000'}});
    SP(["w...w",".w.w.","..w..",".w.w.","w...w"],121,64,{pal:{w:'#000'}});
  },
  q8(t){
    R_(0,0,W,34,'#0b1610');
    R_(0,34,W,3,'#34A948'); R_(0,37,W,14,'#7a4a2a'); R_(0,51,W,14,'#5e3820'); R_(0,65,W,15,'#432716');
    const p=t%9, depth=Math.min(40,p*6);
    R_(80,34,16,depth,'#160d07');
    if(depth>=34 && Math.floor(t*5)%2){ R_(85,68,6,5,'#62C584'); R_(87,67,2,1,'#c8ffd4'); }
    else if(depth>=34){ R_(85,68,6,5,'#34A948'); }
    neo(60,16,{});
    const s=Math.floor(t*4)%2; R_(72,18+s*3,2,13,'#a8693d'); R_(71,30+s*3,4,3,'#9aa39d');
    for(let k=0;k<5;k++){ const ph=(t*1.5+k/5)%1; R_(86-ph*56, 34-Math.sin(ph*Math.PI)*16,2,2,'#a8693d'); }
    const pile=Math.min(8,p*1.2); R_(24,34-pile/2,22,pile/2+1,'#7a4a2a');
  },
  final(t){
    R_(0,0,W,H,'#06110a'); rain(0,0,W,H,t,.4,5,.15);
    const x0=92, y0=12; let n=Math.floor((t%9)*5);
    for(let r=0;r<7;r++) for(let c=0;c<7;c++){ const filled = r===0 || (r-1)*7+c < n; R_(x0+c*9,y0+r*8,8,7, r===0?'#34A948':(filled?'#62C584':'#e8ece9')); }
    const p=t%1.8/1.8, ex=14+p*80, ey=52-Math.sin(p*Math.PI)*30;
    R_(ex,ey,10,7,'#f4f4ef'); R_(ex+1,ey+1,2,1,'#9aa39d'); R_(ex+3,ey+2,4,1,'#9aa39d'); R_(ex+7,ey+1,2,1,'#9aa39d');
    neo(8,50,{});
    for(let k=0;k<18;k++){ const ph=(t*0.5+hash(k))%1; R_(hash(k*5)*W, ph*H, 1,2, ['#34A948','#f2c230','#d97757','#8a7cff','#62C584'][k%5]); }
  },
};

const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let sceneFn = SCENES.start, t0 = performance.now();
function setScene(id){ sceneFn = SCENES[id] || SCENES.start; t0 = performance.now(); if(reduce){ X.clearRect(0,0,W,H); sceneFn(2.2); } }
function loop(now){
  if(!reduce){ const t = Math.floor((now-t0)/70)*0.07; X.clearRect(0,0,W,H); try{ sceneFn(t); }catch(e){} }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ======================================================================
   РЕЖИМ РАЗРАБОТЧИКА: открыть страницу с ?dev=1
   ====================================================================== */
function persistDev(){ writeJSON('l', LS_DEV, DEVSTATE); }
function sendDev(obj){ return post(Object.assign({type:'dev', survey:CONFIG.SURVEY_ID, ts:new Date().toISOString()}, obj)).catch(()=>{}); }
function markDev(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    const e = DEVSTATE.edits[el.dataset.k];
    el.classList.toggle('edited', !!(e && e.text!=null));
    el.classList.toggle('noted', !!(e && e.note && e.text==null));
  });
}
function devModal(content){
  const m = h('div',{class:'devmodal devui',onclick:e=>{ if(e.target===m) m.remove(); }}, h('div',{class:'box'}, content));
  document.body.append(m); const f=m.querySelector('textarea'); if(f) f.focus();
  return m;
}
function openEditor(key){
  const orig = getOrig(key), ed = DEVSTATE.edits[key] || {};
  const ta = h('textarea',{}, ed.text!=null ? ed.text : orig);
  const note = h('textarea',{placeholder:'Например: «сделай короче», «другой тон», «замени пример»'}, ed.note||'');
  const m = devModal([
    h('h3',{},'Правка текста'),
    h('div',{}, 'Ключ: ', h('code',{},key), ' · экран ', h('code',{},S.cur)),
    h('div',{style:'margin:10px 0 4px;font-weight:700'},'Было:'), h('div',{class:'orig'}, orig),
    h('div',{style:'font-weight:700;margin-bottom:4px'},'Новый текст (сразу видно на странице):'), ta,
    h('div',{style:'font-weight:700;margin-bottom:4px'},'Пометка для Claude (если сам текст не меняете):'), note,
    h('div',{class:'acts'},
      h('button',{class:'pri',onclick:()=>{
        const text = ta.value===orig ? null : ta.value, n = note.value.trim();
        if(text==null && !n) delete DEVSTATE.edits[key];
        else DEVSTATE.edits[key] = {text, note:n, orig, screen:S.cur, ts:new Date().toISOString()};
        persistDev(); sendDev({kind:'edit', key, orig, text, note:n, screen:S.cur}); m.remove(); render(); }}, 'Сохранить'),
      h('button',{onclick:()=>{ if(DEVSTATE.edits[key]){ delete DEVSTATE.edits[key]; persistDev(); sendDev({kind:'revert', key, orig, screen:S.cur}); } m.remove(); render(); }}, 'Вернуть исходный'),
      h('button',{onclick:()=>m.remove()}, 'Отмена'))]);
}
function openScreenNote(){
  const cur = DEVSTATE.screenNotes[S.cur] || {};
  const ta = h('textarea',{placeholder:'Про экран целиком: анимация, порядок, лишний вопрос, вёрстка…'}, cur.note||'');
  const m = devModal([h('h3',{},'Пометка к экрану ', h('code',{},S.cur)), ta,
    h('div',{class:'acts'},
      h('button',{class:'pri',onclick:()=>{ const n=ta.value.trim();
        if(n) DEVSTATE.screenNotes[S.cur]={note:n, ts:new Date().toISOString()}; else delete DEVSTATE.screenNotes[S.cur];
        persistDev(); sendDev({kind:'screen', screen:S.cur, note:n}); m.remove(); render(); }}, 'Сохранить'),
      h('button',{onclick:()=>m.remove()}, 'Отмена'))]);
}
function devDump(){ return {survey:CONFIG.SURVEY_ID, exported:new Date().toISOString(), edits:DEVSTATE.edits, screenNotes:DEVSTATE.screenNotes}; }
function openAll(){
  const rows = [
    ...Object.entries(DEVSTATE.screenNotes).map(([s,v])=> h('div',{}, h('b',{},'экран '+s+': '), v.note)),
    ...Object.entries(DEVSTATE.edits).map(([k,v])=> h('div',{}, h('code',{},k), h('br'),
      v.text!=null ? ['«', v.orig, '» → «', h('b',{},v.text), '»'] : '', v.note ? h('div',{style:'color:#b33'}, 'пометка: '+v.note) : '')),
  ];
  const status = h('div',{style:'margin:0 0 10px;color:#5c665f'}, CONFIG.ENDPOINT ? 'Каждая правка сразу уходит в таблицу (лист dev_notes). Claude заберёт оттуда.' : 'Адрес таблицы не задан: правки хранятся только в этом браузере. Нажмите «Скопировать всё» и вставьте Claude в чат.');
  const m = devModal([h('h3',{},'Все правки и пометки'), status,
    h('div',{class:'devlist'}, rows.length ? rows : h('div',{},'Пока пусто.')),
    h('div',{class:'acts'},
      h('button',{class:'pri',onclick:e=>{ const s=JSON.stringify(devDump(),null,1);
        (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(()=>{ e.target.textContent='Скопировано'; })
          .catch(()=>{ const t=h('textarea',{},s); m.querySelector('.box').append(t); t.select(); }); }}, 'Скопировать всё'),
      CONFIG.ENDPOINT ? h('button',{onclick:e=>{ sendDev({kind:'bulk', dump:devDump()}); e.target.textContent='Отправлено'; }}, 'Отправить всё одним пакетом') : null,
      h('button',{onclick:()=>{ if(confirm('Стереть все правки в этом браузере? В таблице они останутся.')){ DEVSTATE.edits={}; DEVSTATE.screenNotes={}; persistDev(); m.remove(); render(); } }}, 'Очистить'),
      h('button',{onclick:()=>m.remove()}, 'Закрыть'))]);
}
function renderDev(){
  const root = document.getElementById('devroot'); root.innerHTML='';
  const nE = Object.values(DEVSTATE.edits).length, nS = Object.keys(DEVSTATE.screenNotes).length;
  const sel = h('select',{'aria-label':'Перейти к экрану',onchange:e=>{ S.cur=e.target.value; save(); render(); }},
    SCREENS.map(s=> h('option',{value:s, selected:s===S.cur}, s)));
  root.append(h('div',{class:'devbar devui'}, h('div',{class:'in'},
    h('b',{},'DEV'), sel,
    h('button',{class:DEVSTATE.editMode?'on':'',onclick:()=>{ DEVSTATE.editMode=!DEVSTATE.editMode; persistDev(); document.body.classList.toggle('dev-edit',DEVSTATE.editMode); renderDev(); }},
      DEVSTATE.editMode ? 'Правка текстов: ВКЛ' : 'Правка текстов: выкл'),
    h('button',{onclick:openScreenNote}, DEVSTATE.screenNotes[S.cur] ? 'Пометка к экрану ✓' : 'Пометка к экрану'),
    h('button',{onclick:openAll}, `Все правки (${nE+nS})`),
    h('button',{onclick:()=>{ if(confirm('Начать анкету заново? Правки текстов останутся.')){ S={sid:newSid(),cur:'start',A:{},visited:['start'],started:new Date().toISOString()}; finalState='idle'; save(); render(); } }}, 'Сброс ответов'))));
}
if(DEV){
  document.body.classList.add('dev');
  document.body.classList.toggle('dev-edit', !!DEVSTATE.editMode);
  document.addEventListener('click', e=>{
    if(!DEVSTATE.editMode) return;
    const t = e.target.closest('[data-k]'); if(!t || t.closest('.devui')) return;
    e.preventDefault(); e.stopPropagation(); openEditor(t.dataset.k);
  }, true);
}

if(S.cur==='final' && !DEV) finalState='sent';
render();
