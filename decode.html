<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Декодер анкеты MS-Ops</title>
<style>
  :root{--ink:#0b0b0b;--green:#34A948;--green2:#62C584;--soft:#eaf7ee;--muted:#5c665f;--yellow:#f2c230;--red:#e5484d;--grey:#b9c0bb;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.45}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:0 0 12px} h2{font-size:17px;margin:26px 0 10px;background:var(--ink);color:#fff;display:inline-block;padding:2px 8px}
  .panel{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px;margin:0 0 16px;background:var(--soft)}
  input,textarea,button{font:inherit}
  input[type=text],input[type=password],textarea{border:2px solid var(--ink);padding:7px 9px;width:100%;background:#fff}
  textarea{min-height:80px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .row>input{flex:1;min-width:220px}
  button{border:2px solid var(--ink);background:var(--green);padding:7px 14px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  button.ghost{background:#fff}
  table{border-collapse:collapse;width:100%;margin:0 0 10px;background:#fff}
  th,td{border:1px solid #cfd5d1;padding:5px 7px;text-align:left;vertical-align:top}
  th{background:#f1f4f2;position:sticky;top:0}
  .scroll{overflow:auto;max-height:70vh;border:2px solid var(--ink)}
  .bar{display:inline-block;height:10px;background:var(--green);vertical-align:middle;margin-right:6px}
  .g{background:#cdeed5}.y{background:#fbecb6}.r{background:#f8c9cb}.u{background:#e6e9e7}
  .bad{outline:2px solid var(--red);outline-offset:-2px}
  .muted{color:var(--muted)}
  .tag{display:inline-block;border:1px solid var(--ink);padding:0 5px;margin:1px;font-size:12px;background:#fff}
  .quote{border-left:4px solid var(--green);padding:4px 10px;margin:6px 0;background:#fafafa}
  #err{color:var(--red);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>Декодер анкеты MS-Ops</h1>
  <div class="panel">
    <div class="row"><b>Из таблицы:</b></div>
    <div class="row"><input type="text" id="ep" placeholder="URL приёмника (…/exec). По умолчанию берётся из index.html"></div>
    <div class="row"><input type="password" id="key" placeholder="Ключ чтения READ_KEY"><button id="load">Загрузить</button></div>
    <div class="row"><b>Или вручную:</b> <span class="muted">вставьте содержимое колонки raw_json, по одной строке JSON на строку</span></div>
    <textarea id="raw"></textarea>
    <div class="row"><button class="ghost" id="parse">Разобрать вставленное</button>
      <label><input type="checkbox" id="hideDev" checked> скрыть тестовые (dev и ТЕСТ)</label>
      <label><input type="checkbox" id="onlyDone"> только завершённые</label>
      <button class="ghost" id="csv">Скачать CSV</button></div>
    <div id="err"></div>
  </div>
  <div id="out"></div>
</div>
<script>
let C = null, ANS = [], DEVN = [];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; localStorage.setItem(k,v); }catch(e){ return ''; } }

// конфиг (тексты и эталоны) берём прямо из index.html, чтобы подписи всегда совпадали
fetch('index.html').then(r=>r.text()).then(src=>{
  const m = src.match(/\/\*CONFIG-START\*\/([\s\S]*?)\/\*CONFIG-END\*\//);
  C = new Function(m[1] + ';return {CONFIG,STRINGS,OPTIONS,FEATURE_LEVELS,FEATURES,TRAFFIC_COLORS,TRAFFIC_CARDS,TRAFFIC_REFERENCE,AUTOMATION_TOPICS,EXAMPLES,SESSION_BLOCKS};')();
  if(!$('ep').value) $('ep').value = ls('msops_ep') || C.CONFIG.ENDPOINT || '';
}).catch(e=>{ $('err').textContent = 'Не удалось прочитать index.html: '+e; });
$('key').value = ls('msops_key');

const L = (list, id) => { const f = (list||[]).find(x=>x.id===id); return f ? f.label : id; };

$('load').onclick = async ()=>{
  $('err').textContent=''; const ep=$('ep').value.trim(), key=$('key').value.trim();
  ls('msops_ep', ep); ls('msops_key', key);
  try{
    const r = await fetch(ep + '?key=' + encodeURIComponent(key)); const d = await r.json();
    if(!d.ok) throw new Error(d.error==='key' ? 'неверный ключ' : d.error);
    ANS = d.answers; DEVN = d.dev; draw();
  }catch(e){ $('err').textContent = 'Ошибка загрузки: ' + e.message; }
};
$('parse').onclick = ()=>{
  ANS = $('raw').value.split('\n').map(s=>s.trim().replace(/^'/,'')).filter(Boolean).map(s=>{ try{ return JSON.parse(s); }catch(e){ return null; } }).filter(x=>x && !x.type);
  DEVN = []; draw();
};
['hideDev','onlyDone'].forEach(id=> $(id).onchange = draw);

function rows(){ return ANS.filter(p=> (!$('hideDev').checked || !p.dev) && (!$('onlyDone').checked || p.status==='done')); }
function count(arr){ const m={}; arr.forEach(v=>{ if(v!=='' && v!=null) m[v]=(m[v]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function bars(list, labeler, total){
  if(!list.length) return '<p class="muted">нет ответов</p>';
  return '<table>' + list.map(([k,n])=>`<tr><td style="width:55%">${esc(labeler(k))}</td><td><span class="bar" style="width:${Math.round(n/Math.max(total,1)*200)}px"></span>${n}</td></tr>`).join('') + '</table>';
}

function draw(){
  if(!C){ setTimeout(draw, 200); return; }
  const P = rows(), N = P.length, o = [];
  const fake = C.FEATURES.filter(f=>f.fake).map(f=>f.id);
  o.push(`<h2>Люди: ${N}</h2>`);
  o.push('<div class="scroll"><table><tr><th>Имя</th><th>Статус</th><th>Дошёл до</th><th>Частота</th><th>Автоматизация</th><th>overclaim</th><th>Блоки сессии по порядку</th></tr>' +
    P.map(p=>`<tr><td>${esc(p.name||'—')}${p.test?' <span class="tag" style="background:#f8c9cb" title="'+esc(p.test_note||'')+'">ТЕСТ</span>':(p.dev?' <span class="tag">dev</span>':'')}</td><td>${esc(p.status)}</td><td>${esc(p.last_screen)}</td>
      <td>${esc(L(C.OPTIONS.q1,p.q1))}</td><td>${esc(L(C.OPTIONS.q6,p.q6))}</td>
      <td>${p.overclaim?'<b style="color:#e5484d">да</b>':''}</td>
      <td>${esc((p.q8||[]).map(b=>L(C.SESSION_BLOCKS,b).split(':')[0]).join(' > '))}</td></tr>`).join('') + '</table></div>');

  // Q8: 1 место = 4 балла … 4 место = 1
  const score = {}; P.forEach(p=>(p.q8||[]).forEach((b,i)=>{ score[b]=(score[b]||0)+(4-i); }));
  o.push('<h2>Q8 · Блоки сессии (1 место = 4 балла)</h2>' + bars(Object.entries(score).sort((a,b)=>b[1]-a[1]), k=>L(C.SESSION_BLOCKS,k), 4*N));

  o.push('<h2>Q1 · Частота</h2>' + bars(count(P.map(p=>p.q1)), k=>L(C.OPTIONS.q1,k), N));
  o.push('<h2>Q2 · Что мешает</h2>' + bars(count(P.flatMap(p=>p.q2||[])), k=>L(C.OPTIONS.q2,k), N) +
    P.filter(p=>p.q2_other).map(p=>`<div class="quote">${esc(p.q2_other)} · ${esc(p.name||'—')}</div>`).join(''));

  o.push('<h2>Q3 · База: что знакомо</h2><table><tr><th>Функция</th>' + C.FEATURE_LEVELS.map(l=>`<th>${esc(l.label)}</th>`).join('') + '</tr>' +
    C.FEATURES.map(f=>`<tr><td>${esc(f.label)}${f.fake?' <span class="tag">ловушка</span>':''}</td>` + C.FEATURE_LEVELS.map(l=>`<td>${P.filter(p=>(p.q3||{})[f.id]===l.id).length||''}</td>`).join('') + '</tr>').join('') +
    `</table><p>Флаг overclaim: ${P.filter(p=>p.overclaim).map(p=>esc(p.name||'—')).join(', ') || 'нет'}</p>`);

  o.push('<h2>Q4 · Куда ИИ пойдёт искать ответ</h2>' + `<p>Не знаю: ${P.filter(p=>p.q4_unknown).length}</p>` +
    (P.filter(p=>p.q4).map(p=>`<div class="quote"><b>${esc(p.name||'—')}</b><br>${esc(p.q4)}</div>`).join('') || '<p class="muted">нет ответов</p>'));

  const ref = C.TRAFFIC_REFERENCE||{}, hasRef = Object.keys(ref).length>0, cls={green:'g',yellow:'y',red:'r',unknown:'u'};
  o.push('<h2>Q5 · Светофор</h2>' + (hasRef?'<p class="muted">Красная рамка — расхождение с эталоном.</p>':'<p class="muted">Эталон TRAFFIC_REFERENCE не задан.</p>') +
    '<div class="scroll"><table><tr><th>Карточка</th>' + (hasRef?'<th>Эталон</th>':'') + P.map(p=>`<th>${esc(p.name||'—')}</th>`).join('') + '</tr>' +
    C.TRAFFIC_CARDS.map(c=>`<tr><td>${esc(c.label)}</td>` + (hasRef?`<td class="${cls[ref[c.id]]||''}">${esc(L(C.TRAFFIC_COLORS,ref[c.id])||'')}</td>`:'') +
      P.map(p=>{ const v=(p.q5||{})[c.id]; const bad = hasRef && v && ref[c.id] && v!==ref[c.id]; return `<td class="${cls[v]||''} ${bad?'bad':''}">${esc(v?L(C.TRAFFIC_COLORS,v):'')}</td>`; }).join('') + '</tr>').join('') + '</table></div>');

  o.push('<h2>Q6 · Автоматизация</h2>' + bars(count(P.map(p=>p.q6)), k=>L(C.OPTIONS.q6,k), N) +
    '<p><b>Что хочется понять:</b></p>' + bars(count(P.flatMap(p=>p.q6_want||[])), k=>L(C.AUTOMATION_TOPICS,k), N));

  o.push('<h2>Q7 · Примеры из Пайнли</h2>' + bars(count(P.flatMap(p=>p.q7||[])), k=>L(C.EXAMPLES,k), N) +
    P.filter(p=>p.q7_other).map(p=>`<div class="quote">${esc(p.q7_other)} · ${esc(p.name||'—')}</div>`).join(''));

  const free = P.filter(p=>p.q8_awkward).map(p=>[p.name, p.q8_awkward]);
  o.push('<h2>Неловкие вопросы</h2>' + (free.length ? free.map(([n,t])=>`<div class="quote">${esc(n||'—')}<br>${esc(t)}</div>`).join('') : '<p class="muted">нет</p>'));

  if(DEVN.length){
    o.push('<h2>Правки из режима разработчика</h2><div class="scroll"><table><tr><th>Время</th><th>Тип</th><th>Экран</th><th>Ключ</th><th>Было</th><th>Стало</th><th>Пометка</th></tr>' +
      DEVN.map(d=>`<tr><td>${esc((d.ts||'').slice(0,16))}</td><td>${esc(d.kind)}</td><td>${esc(d.screen)}</td><td>${esc(d.key)}</td><td>${esc(d.orig)}</td><td>${esc(d.text)}</td><td>${esc(d.note)}</td></tr>`).join('') + '</table></div>');
  }
  $('out').innerHTML = o.join('');
}

$('csv').onclick = ()=>{
  if(!C) return;
  const P = rows();
  const cols = ['name','status','last_screen','q1','q2','q2_other', ...C.FEATURES.map(f=>'q3:'+f.id), 'overclaim','q4','q4_unknown',
    ...C.TRAFFIC_CARDS.map(t=>'q5:'+t.id), 'q6','q6_want','q7','q7_other','q8','q8_awkward','ts','sid'];
  // коды ответов → русские подписи из конфига анкеты
  const LISTS = {q1:C.OPTIONS.q1, q2:C.OPTIONS.q2, q6:C.OPTIONS.q6, q6_want:C.AUTOMATION_TOPICS, q7:C.EXAMPLES, q8:C.SESSION_BLOCKS};
  const val = (p,c)=>{
    if(c.startsWith('q3:')){ const v=(p.q3||{})[c.slice(3)]; return v ? L(C.FEATURE_LEVELS,v) : ''; }
    if(c.startsWith('q5:')){ const v=(p.q5||{})[c.slice(3)]; return v ? L(C.TRAFFIC_COLORS,v) : ''; }
    const v = p[c];
    if(Array.isArray(v)) return v.map(x=> LISTS[c] ? L(LISTS[c],x) : x).join(c==='q8' ? ' > ' : '; ');
    if(typeof v==='boolean') return v ? 'да' : '';
    if(LISTS[c] && v) return L(LISTS[c],v);
    return v==null ? '' : v;
  };
  const head = c => c.startsWith('q3:') ? 'q3: '+L(C.FEATURES,c.slice(3)) : c.startsWith('q5:') ? 'q5: '+L(C.TRAFFIC_CARDS,c.slice(3)) : c;
  const q = s => { s=String(s); if(/^[=+\-@]/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
  const csv = '﻿' + [cols.map(c=>q(head(c))).join(','), ...P.map(p=>cols.map(c=>q(val(p,c))).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = 'msops-answers.csv'; a.click();
};
</script>
</body>
</html>
